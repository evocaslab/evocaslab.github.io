# Builds docs.evocaslab.com from tools.json and schemas.json (build.py) and deploys it to GitHub Pages.
# Copied from the evocaslab/repo-template pages.yml draft. Repo setting, once (the maintainer's step):
#   gh api -X PUT repos/evocaslab/evocaslab.github.io/pages -f build_type=workflow
# and the `github-pages` environment limited to the `main` branch. Until then Pages keeps the legacy branch build.
# Actions are pinned by commit SHA (the tag in the comment); Dependabot's github-actions updates keep them current.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a running deploy is never cancelled half-way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds _site/ and checks every page: meta CSP first in <head>, rel=canonical, no inline script or style,
      # no resource from another host (HQ practices/web-site-privacy-and-headers.md, GitHub Pages meta-CSP exception).
      - name: Build and check the site
        run: python3 build.py --out _site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only this job may deploy: OIDC token, no stored secret.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
